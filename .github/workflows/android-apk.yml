name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted Ubuntu runners include the Android SDK already.
      # setup-android's default "tools" package is not available in this runner image.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"

      # Persist the same debug signing certificate across workflow runs.
      # Never commit a release keystore or secrets to the public repository.
      - name: Restore existing Android debug signing key
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sima-android-debug-signing-v1

      - name: Verify update-compatible signing key
        run: |
          if [ "${{ steps.debug-signing-cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Cached signing key is unavailable. Refusing to generate another key: it would break Android upgrades. Restore the original signing key using a secure GitHub Actions secret."
            exit 1
          fi
          test -f "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E 'SHA256:|Valid from:'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync plugins and web files
        run: npx cap sync android

      - name: Set monotonically increasing Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("android/app/build.gradle")
          text = path.read_text()
          code = int(os.environ["ANDROID_VERSION_CODE"])
          if code <= 1:
              raise SystemExit("Invalid Android version code")
          text, count_code = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: sima-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
, lambda m: f'{m.group(1)}versionCode {code}', text, count=1)
          text, count_name = re.subn(r'(?m)^(\s*)versionName\s+["\'][^"\']+["\']\s*
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: sima-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
, lambda m: f'{m.group(1)}versionName "0.1.{code}"', text, count=1)
          if (count_code, count_name) != (1, 1):
              raise SystemExit("Cannot safely update Android versionCode/versionName")
          path.write_text(text)
          print(f"Building Android versionCode={code} versionName=0.1.{code}")
          PY

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Verify APK certificate and version
        env:
          EXPECTED_SHA256: "326C56C2341FB6D53D543E4254D2FF4963854A89A06A54A1BDCC58F24493ADEB"
          EXPECTED_VERSION_CODE: ${{ github.run_number }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK certificate changed! Refusing incompatible Android update."
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep '^package:'
          "$AAPT" dump badging "$APK" | grep -q "versionCode='$EXPECTED_VERSION_CODE'"
          echo "APK signing and version code verified: $EXPECTED_VERSION_CODE"

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: sima-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
